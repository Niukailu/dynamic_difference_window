[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddw-reference"
version = "0.1.0"
description = "CUDA dynamic-window differential and linear hull search for SIMON and SIMECK"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
cuda13 = ["cupy-cuda13x>=14,<15"]
cuda12 = ["cupy-cuda12x>=13,<15"]

[project.scripts]
ddw-reference = "ddw.__main__:main"
ddw-beam = "ddw.search:main"
ddw-multigpu = "ddw.multigpu:main"
ddw-refine = "ddw.refine:main"

[tool.setuptools]
packages = ["ddw"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
